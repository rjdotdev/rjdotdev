# Refreshes the contribution heatmap SVGs + stats.json from the live GitHub calendar once a day.
# PNG panels (hero/fastfetch/cards) are rendered locally with `python3 _src/build.py`.
name: refresh-contrib
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _src/build.py --svg-only
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-*.svg assets/contrib.json assets/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap"
          git push
